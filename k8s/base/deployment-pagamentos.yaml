apiVersion: apps/v1
kind: Deployment
metadata:
  name: servico-pagamentos
  namespace: pedidos-veloz
spec:
  replicas: 2
  selector:
    matchLabels:
      app: pagamentos
  template:
    metadata:
      labels:
        app: pagamentos
    spec:
      containers:
      - name: pagamentos
        image: pagamentos-osmar:v5.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3002
---
apiVersion: v1
kind: Service
metadata:
  name: pagamentos-service
  namespace: pedidos-veloz
spec:
  selector:
    app: pagamentos
  ports:
    - protocol: TCP
      port: 80
      targetPort: 3002
  type: ClusterIP