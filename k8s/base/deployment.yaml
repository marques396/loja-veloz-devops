apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway        # Nome único para o Gateway
  namespace: pedidos-veloz
spec:
  replicas: 2              # Alta disponibilidade na porta de entrada
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
      - name: gateway
        image: osmar/api-gateway:latest 
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080 # Porta padrão para Gateways Node/Nginx
        envFrom:
        - configMapRef:
            name: pedidos-config # Para saber as URLs dos outros serviços