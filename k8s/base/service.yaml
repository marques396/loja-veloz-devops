apiVersion: v1
kind: Service
metadata:
  name: pedidos-service
  namespace: pedidos-veloz
spec:
  selector:
    app: servico-pedidos
  ports:
    - protocol: TCP
      port: 80
      targetPort: 3001
---
apiVersion: v1
kind: Service
metadata:
  name: estoque-service
  namespace: pedidos-veloz
spec:
  selector:
    app: servico-estoque
  ports:
    - protocol: TCP
      port: 80
      targetPort: 3003
---
apiVersion: v1
kind: Service
metadata:
  name: pagamentos-service
  namespace: pedidos-veloz
spec:
  selector:
    app: servico-pagamentos
  ports:
    - protocol: TCP
      port: 80
      targetPort: 3002
---
apiVersion: v1
kind: Service
metadata:
  name: frete-service
  namespace: pedidos-veloz
spec:
  selector:
    app: servico-frete
  ports:
    - protocol: TCP
      port: 80
      targetPort: 3005
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway-service
  namespace: pedidos-veloz
spec:
  type: LoadBalancer
  selector:
    app: api-gateway
  ports:
    - protocol: TCP
      port: 80
      targetPort: 3000