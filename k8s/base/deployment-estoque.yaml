apiVersion: apps/v1
kind: Deployment
metadata:
  name: servico-estoque
  namespace: pedidos-veloz
spec:
  replicas: 2
  selector:
    matchLabels:
      app: estoque
  template:
    metadata:
      labels:
        app: estoque
    spec:
      containers:
      - name: estoque
        image: estoque-osmar:v1.0
        ports:
        - containerPort: 3003
        # Aqui está o segredo: ele puxa as configurações que você já criou
        envFrom:
          - configMapRef:
              name: pedidos-config
          - secretRef:
              name: db-passwords
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "200m"
            memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: estoque-service
  namespace: pedidos-veloz
spec:
  selector:
    app: estoque
  ports:
    - protocol: TCP
      port: 80
      targetPort: 3003