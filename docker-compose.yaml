services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: pedidos_db
      POSTGRES_PASSWORD: admin_password
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"

  api-gateway:
    build: ./api-gateway
    ports:
      - "3000:3000"
    depends_on:
      - servico-pedidos

  servico-pedidos:
    build: ./servico-pedidos
    ports:
      - "3002:3002"
    environment:
      DB_HOST: postgres
      RABBITMQ_HOST: rabbitmq
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_started

  servico-pagamentos:
    build: ./servico-pagamentos
    ports:
      - "3001:3001"
    depends_on:
      - rabbitmq
      - servico-frete

  servico-frete:
    build: ./servico-frete
    ports:
      - "3005:3005"
    environment:
      - PROMO_FRETE_GRATIS=true
    depends_on:
      - rabbitmq

  servico-estoque:
    build: ./servico-estoque
    ports:
      - "3003:3003"
    environment:
      - RABBITMQ_HOST=rabbitmq
    depends_on:
      - rabbitmq