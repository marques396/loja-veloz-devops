name: CI - Build e Teste

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        # ATUALIZADO: v4 usa Node.js mais recente, removendo o aviso de obsolescência
        uses: actions/checkout@v4

      - name: Build das Imagens (Teste)
        # CORREÇÃO ERRO 127: 'docker compose' (com espaço) e caminho do projeto
        run: docker compose -f infra/compose/docker-compose.yml build

      - name: Linter e Testes
        run: |
          echo "Rodando verificações na Loja Veloz..."